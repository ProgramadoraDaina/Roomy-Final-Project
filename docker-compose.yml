services:
  postgres:
    image: postgres:16-alpine
    container_name: roomy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomy
      POSTGRES_PASSWORD: roomy
      POSTGRES_DB: roomy
    ports:
      - '5432:5432'
    volumes:
      - roomy_postgres_data:/var/lib/postgresql/data

volumes:
  roomy_postgres_data:
